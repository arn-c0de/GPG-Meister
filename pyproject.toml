[project]
name = "gpg-meister"
version = "1.0.2"
description = "Local-first GPG key management, message encryption, and encrypted vault backup."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GPG Meister Contributors" }]

# Crypto-critical dependencies (upgrades require explicit security sign-off):
#   cryptography, argon2-cffi, python-gnupg, pydantic
dependencies = [
    "PySide6>=6.7",
    "python-gnupg>=0.5.3",
    "cryptography>=42.0",
    "argon2-cffi>=25.1",
    "pydantic>=2.7",
    "tomli-w>=1.2",
    "msgpack>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.0",
]
packaging = [
    "PyInstaller>=6.10",
    "py2app>=0.28",
]

[project.scripts]
gpg-meister = "gpg_meister.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/gpg_meister/i18n/*.qm",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpg_meister"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "S",                  # bandit-like security
    "SIM",                # simplify
    "RUF",                # ruff-specific
    "TID",                # tidy imports
]
ignore = [
    "S101",               # asserts are fine in app code; tests use them widely
    "E501",               # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["gnupg.*", "argon2.*", "msgpack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests requiring an installed GnuPG binary",
    "security: tests asserting security invariants",
    "slow: tests that may take >1s (KDF benchmarks etc.)",
]

[tool.coverage.run]
branch = true
source = ["src/gpg_meister"]
omit = ["src/gpg_meister/ui/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
