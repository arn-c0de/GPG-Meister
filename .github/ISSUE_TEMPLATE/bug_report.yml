name: Bug Report
description: Report a bug, regression, or broken workflow
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Please keep the report focused and reproducible. If the issue looks security-sensitive, use the contact path in `SECURITY.md` instead of filing it publicly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is going wrong?
      placeholder: A short description of the problem
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: For example `1.0.2`
      placeholder: 1.0.2

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste useful error text, screenshots, or logs if available. Do not include secrets, private keys, or passphrases.
      render: shell

