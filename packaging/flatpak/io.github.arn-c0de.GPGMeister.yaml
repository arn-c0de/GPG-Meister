app-id: io.github.arn-c0de.GPGMeister
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
command: gpg-meister
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-config/gpg-meister
  - --filesystem=xdg-data/gpg-meister
  - --filesystem=xdg-state/gpg-meister
modules:
  - name: gpg-meister
    buildsystem: simple
    build-commands:
      - python3 scripts/build_translations.py
      - pip3 install --no-deps --prefix=/app .
      - install -Dm644 packaging/linux/io.github.arn-c0de.GPGMeister.desktop /app/share/applications/io.github.arn-c0de.GPGMeister.desktop
      - install -Dm644 packaging/linux/io.github.arn-c0de.GPGMeister.metainfo.xml /app/share/metainfo/io.github.arn-c0de.GPGMeister.metainfo.xml
      - install -Dm644 packaging/linux/io.github.arn-c0de.GPGMeister.svg /app/share/icons/hicolor/scalable/apps/io.github.arn-c0de.GPGMeister.svg
    sources:
      - type: dir
        path: ../../
